spring.application.name=event-notification

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true

delivery.retry.max-attempts=8
delivery.retry.base-delay=1s
delivery.retry.max-delay=5m

webhook.http.connect-timeout=5s
webhook.http.read-timeout=10s
webhook.http.max-response-bytes=8192
webhook.http.allowed-port=443
webhook.http.max-text-length=500

worker.batch-size=20
worker.lease-duration=2m
worker.poll-interval=5s
worker.concurrency.global=50
worker.concurrency.per-client=5

replay.rate-limit.capacity=20
replay.rate-limit.window=1m

ingestion.json.location=file:challenge/notification_events.json
ingestion.json.enabled=false

demo.seed.enabled=false
demo.seed.webhook-urls.CLIENT001=${WEBHOOK_CLIENT001_URL:https://webhook.site/2ae50314-a3ad-475e-8dff-e393fbf50982}
demo.seed.webhook-urls.CLIENT002=${WEBHOOK_CLIENT002_URL:https://webhook.site/dcedfde4-5bd7-4ce8-9a34-09b1765da8ca}
demo.seed.webhook-urls.CLIENT003=${WEBHOOK_CLIENT003_URL:https://webhook.site/1e427182-b454-4b6a-b896-fbfe85604da9}
